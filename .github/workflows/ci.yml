name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]  # macos-15 is Apple Silicon (osx-arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.74.0
          cache: true
          locked: true

      - name: Unit tests
        run: pixi run test

      - name: Fetch BioNetGen
        run: pixi run fetch-bionetgen

      - name: Integration test (one real ODE pilot run)
        run: pixi run test-integration

      - name: Vendored comparison core matches upstream
        run: pixi run pytest -q -m network
