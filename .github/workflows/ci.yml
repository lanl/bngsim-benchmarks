name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]  # macos-15 is Apple Silicon (osx-arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # No pixi-version: install the latest pixi. A pinned, older pixi
          # recomputes the workspace hash from an older serialization and rejects
          # a pixi.lock that a newer local pixi wrote (`locked: true`), failing
          # every job before a test runs. The skew is one-directional -- newer
          # pixi reads older locks fine -- so tracking latest keeps CI's pixi at
          # or ahead of whatever wrote the lock and the mismatch cannot recur.
          # `requires-pixi` in pixi.toml sets the floor both sides must clear.
          cache: true
          locked: true

      - name: Unit tests
        run: pixi run test

      - name: Fetch BioNetGen
        run: pixi run fetch-bionetgen

      - name: Integration test (one real ODE pilot run)
        run: pixi run test-integration

      - name: Vendored comparison core matches upstream
        run: pixi run pytest -q -m network
