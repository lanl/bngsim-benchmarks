# The environment every job runs in. `pixi install` builds it from this file and
# pixi.lock; `pixi run fetch-bionetgen` adds the BioNetGen distribution, which is
# not a conda package and is pinned by release tarball and sha256 instead.
#
# Engines join as their capabilities migrate (docs/DESIGN.md section 11): this
# environment carries what the ODE capability needs -- bngsim and BioNetGen, plus
# libRoadRunner as a second reference ODE engine (reads SBML exported from the
# same network). AMICI and COPASI come with later capabilities that compare
# against them.

[workspace]
name = "bngsim-benchmarks"
description = "Benchmark and cross-engine correctness jobs for BNGsim"
channels = ["conda-forge"]
# The floor every pixi -- local and CI -- must clear. pixi.lock is serialized by
# the pixi that writes it, and an older pixi rejects a newer pixi's lock under
# --locked (the mismatch that reddened CI once). CI tracks the latest pixi so it
# never trails the writer; this line is the shared minimum that makes the lock's
# serialization legible to both. Raise it when a pixi feature the suite depends
# on lands; it need not track the exact local version.
requires-pixi = ">=0.84"
# libRoadRunner 2.11.0 ships its Apple-silicon wheel as macosx_14_0_arm64; pixi's
# default osx-arm64 floor is macOS 13, which would reject it. Raise the osx-arm64
# floor to 14 so that wheel resolves. (linux-64 is unaffected.)
platforms = ["linux-64", { name = "osx-arm64-14", platform = "osx-arm64", macos = "14.0" }]

[dependencies]
python = "3.12.*"
# BNG2.pl, BioNetGen's network generator, is a Perl program.
perl = "*"
numpy = ">=2.0"
pyyaml = "*"
pytest = "*"
# AMICI's toolchain. AMICI ships an sdist only (never a wheel), so installing it
# compiles its C++/SWIG core, and every model it runs compiles a fresh C++ module
# via `sbml2amici` using $CC/$CXX. Both must build against this env's own
# libstdc++, not the node's system GCC 8.5: a std::filesystem ABI mismatch against
# the conda-forge libstdc++ is exactly what segfaulted the bngsim core on ARM (see
# docs/BUILD_NOTES.md). conda-forge's c-/cxx-compiler metapackages pin a GCC whose
# libstdc++ matches the env's, so the compiled extensions are ABI-correct.
c-compiler = "*"
cxx-compiler = "*"
swig = ">=4.1"
cmake = "*"
ninja = "*"

[pypi-dependencies]
# The build under test. Every result records the version and compiled build
# commit it measured, so a result from another build is never mistaken for one
# from this one.
bngsim = "==0.17.2"
# libRoadRunner, a second reference ODE engine. PyPI-only (no conda-forge build);
# the import name is `roadrunner`. 2.11.0 ships a cp312 manylinux_2_28 x86_64
# wheel (matches Darwin's glibc 2.28) and a macosx_14_0_arm64 wheel. There is no
# linux-aarch64 wheel (nor an sdist), so on ARM it is built from source
# (sys-bio/roadrunner v2.11.0, with a prebuilt conda-forge LLVM 13 -- not from
# source) and the suite is pointed at that build with $BENCH_ROADRUNNER_PATH,
# leaving this pin untouched. See docs/BUILD_NOTES.md; the ARM leg is the
# cross-platform gate's (docs/DESIGN.md section 9.1).
libroadrunner = "==2.11.0"
# COPASI, a third reference ODE engine, driven through BASICO (`copasi-basico`,
# imported as `basico`), a pure-Python wrapper over the SWIG bindings. basico 0.92
# is `py3-none-any`; the native code lives in `python-copasi`, pinned explicitly so
# the lock is reproducible. python-copasi 4.48.311 ships cp312 manylinux_2_28
# wheels for BOTH x86_64 and linux-aarch64 (and macosx arm64) -- so unlike
# libRoadRunner, COPASI needs no from-source build on any platform the suite runs
# on. The adapter reads SBML exported from the same `.net` (see ode.py). Not yet in
# REFERENCE_ENGINES: adding it re-ids the ODE corpus, deferred past the section 9.1
# cross-platform timing leg (docs/DESIGN.md section 9.1).
copasi-basico = "==0.92"
python-copasi = "==4.48.311"
# AMICI, a fourth reference ODE engine (CVODES BDF), reading the same exported
# SBML. PyPI ships an sdist only -- no wheels, ever -- so this compiles AMICI's
# C++/SWIG core from source on install (SUNDIALS is vendored; no LLVM), and every
# model it runs compiles a fresh C++ module via `sbml2amici`. Both use $CC/$CXX
# (set to the conda-forge compiler, see [target.linux-64.activation.env]) so the
# extensions are ABI-matched to this env's libstdc++. PINNED TO 1.1.0, one below
# latest: 1.2.0 has open regressions -- a reused solver leaks CVODES root-finding
# state so a warm re-run differs from a fresh one (breaks the reset-and-rerun
# timing contract), and a timepoint near an event can return NaN with status==0
# (silent wrong results). Do NOT bump to 1.2.0 until both are fixed upstream.
# Not yet in REFERENCE_ENGINES: adding it re-ids the ODE corpus, deferred past the
# section 9.1 cross-platform timing leg (docs/DESIGN.md section 9.1).
amici = "==1.1.0"
bngsim-benchmarks = { path = ".", editable = true }

[activation.env]
# The BioNetGen distribution `pixi run fetch-bionetgen` installs. Jobs use this
# copy, not one found elsewhere on the machine, and record its sha256.
BNGPATH = "$PIXI_PROJECT_ROOT/.cache/bionetgen/BioNetGen-2.9.3"
# Read every text file as UTF-8, whatever a node's locale. Python turns UTF-8 mode
# on by itself only in the C/POSIX locales; a node whose locale is ASCII or Latin-1
# would otherwise fail to load a model file with a non-ASCII byte (83 of the 895
# corpus BNGL files have one). This covers BNGsim's own reads too, not just the
# harness's. It is not part of a result's freshness key.
PYTHONUTF8 = "1"
# Ignore the user's own site-packages (~/.local/lib/pythonX.Y/site-packages). Python
# puts that directory ahead of the environment's, so anything a user once installed
# with `pip install --user` (numpy, pandas, sympy, pyyaml, ...) silently replaces the
# locked version in every run, Slurm workers included, and a result no longer comes
# from the environment pixi.lock describes. Not part of a result's freshness key.
PYTHONNOUSERSITE = "1"
# Build AMICI without HDF5. AMICI uses HDF5 only to read/write simulation data as
# files; the suite drives it in-process through numpy and never touches that path.
# Left to its default (ON "if available"), AMICI's CMake half-finds HDF5 -- the C
# headers resolve but the C++ header H5Cpp.h does not -- and the build fails
# compiling hdf5.cpp. OFF both skips an unused native dependency and makes the
# build self-contained. Set globally (not linux-64-only) because it must hold at
# install time AND when each model's `sbml2amici` compiles, on every platform.
AMICI_TRY_ENABLE_HDF5 = "OFF"
# Compile AMICI in parallel. Unset, AMICI pins CMAKE_BUILD_PARALLEL_LEVEL=1 --
# serial -- for both its sdist install build and every per-model `sbml2amici`
# compile, which on a 2-core CI runner risks the job timeout. Empty means "use all
# hardware threads". This is timing-safe: a model's compile happens in the
# adapter's __init__ (recorded as codegen_seconds), never inside the timed
# run()/warm(), so parallelism here cannot affect a measured trajectory time.
AMICI_PARALLEL_COMPILE = ""

# Point AMICI's compiler at the env's conda-forge GCC, not the node's system gcc.
# linux-64 only, because the compiler triple is x86_64-specific and this is the
# platform with the ABI trap: pixi does not run conda's compiler-activation
# scripts, so CC/CXX are otherwise unset and AMICI's sdist build and its per-model
# `sbml2amici` compiles fall back to /usr/bin/gcc (8.5 on Darwin) -- whose
# libstdc++ ABI does not match the env's, the std::filesystem mismatch that
# segfaulted the bngsim core on ARM. The conda-forge compiler metapackage installs
# these fully-qualified binaries; they resolve libstdc++ from this env.
# $PIXI_PROJECT_ROOT keeps the path portable. (On osx-arm64 AMICI builds with the
# platform's own clang, which is ABI-stable, so no override is needed there; on the
# out-of-tree aarch64 env the triple is aarch64-conda-linux-gnu -- see dev notes.)
[target.linux-64.activation.env]
CC = "$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/x86_64-conda-linux-gnu-gcc"
CXX = "$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/x86_64-conda-linux-gnu-g++"

[tasks]
fetch-bionetgen = { cmd = "bench fetch-bionetgen", description = "Download BioNetGen 2.9.3 and check its sha256" }
fetch-models = { cmd = "bench fetch-models", description = "Download every model file the problem specs pin and check its sha256" }
fetch-glibc = { cmd = "bench fetch-glibc", description = "Install a newer glibc loader so run_network loads on old-glibc Linux hosts" }
test = { cmd = "pytest -q -m 'not integration and not network'", description = "Unit tests; no simulator needed" }
test-integration = { cmd = "pytest -q -m integration", description = "Real simulations; needs fetch-bionetgen first" }
doctor = { cmd = "bench doctor", description = "Report the environment a job would record" }
