# The environment every job runs in. `pixi install` builds it from this file and
# pixi.lock; `pixi run fetch-bionetgen` adds the BioNetGen distribution, which is
# not a conda package and is pinned by release tarball and sha256 instead.
#
# Engines join as their capabilities migrate (docs/DESIGN.md section 11): this
# environment carries what the ODE capability needs -- bngsim and BioNetGen, plus
# libRoadRunner as a second reference ODE engine (reads SBML exported from the
# same network). AMICI and COPASI come with later capabilities that compare
# against them.

[workspace]
name = "bngsim-benchmarks"
description = "Benchmark and cross-engine correctness jobs for BNGsim"
channels = ["conda-forge"]
# libRoadRunner 2.11.0 ships its Apple-silicon wheel as macosx_14_0_arm64; pixi's
# default osx-arm64 floor is macOS 13, which would reject it. Raise the osx-arm64
# floor to 14 so that wheel resolves. (linux-64 is unaffected.)
platforms = ["linux-64", { name = "osx-arm64-14", platform = "osx-arm64", macos = "14.0" }]

[dependencies]
python = "3.12.*"
# BNG2.pl, BioNetGen's network generator, is a Perl program.
perl = "*"
numpy = ">=2.0"
pyyaml = "*"
pytest = "*"

[pypi-dependencies]
# The build under test. Every result records the version and compiled build
# commit it measured, so a result from another build is never mistaken for one
# from this one.
bngsim = "==0.17.2"
# libRoadRunner, a second reference ODE engine. PyPI-only (no conda-forge build);
# the import name is `roadrunner`. 2.11.0 ships a cp312 manylinux_2_28 x86_64
# wheel (matches Darwin's glibc 2.28) and a macosx_14_0_arm64 wheel. There is no
# linux-aarch64 wheel (nor an sdist), so on ARM it must be built from source
# (sys-bio/roadrunner v2.11.0; LLVM from source) before the ARM leg of the
# cross-platform gate can add it. The ARM fleet itself is available, and BNGsim
# and run_network already build and run there (docs/DESIGN.md section 9.1).
libroadrunner = "==2.11.0"
bngsim-benchmarks = { path = ".", editable = true }

[activation.env]
# The BioNetGen distribution `pixi run fetch-bionetgen` installs. Jobs use this
# copy, not one found elsewhere on the machine, and record its sha256.
BNGPATH = "$PIXI_PROJECT_ROOT/.cache/bionetgen/BioNetGen-2.9.3"
# Read every text file as UTF-8, whatever a node's locale. Python turns UTF-8 mode
# on by itself only in the C/POSIX locales; a node whose locale is ASCII or Latin-1
# would otherwise fail to load a model file with a non-ASCII byte (83 of the 895
# corpus BNGL files have one). This covers BNGsim's own reads too, not just the
# harness's. It is not part of a result's freshness key.
PYTHONUTF8 = "1"

[tasks]
fetch-bionetgen = { cmd = "bench fetch-bionetgen", description = "Download BioNetGen 2.9.3 and check its sha256" }
fetch-glibc = { cmd = "bench fetch-glibc", description = "Install a newer glibc loader so run_network loads on old-glibc Linux hosts" }
test = { cmd = "pytest -q -m 'not integration and not network'", description = "Unit tests; no simulator needed" }
test-integration = { cmd = "pytest -q -m integration", description = "Real simulations; needs fetch-bionetgen first" }
doctor = { cmd = "bench doctor", description = "Report the environment a job would record" }
