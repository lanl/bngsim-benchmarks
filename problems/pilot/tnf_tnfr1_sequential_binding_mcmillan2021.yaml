# Sequential binding of trivalent TNF to monovalent TNFR1. A provisional pilot problem for the
# network-free capability, until its core suites are chosen and audited (docs/DESIGN.md §3.2); in
# the approved proposal it is nf-xml-aggregation member 3, the strict finite anchor: its network is
# finite (9 species, 24 reactions) and generated whole, so network-free simulation must sample the
# law of exact SSA on it, and both run_network's SSA and BNGsim's are references. The protocol is
# the record's own network-free benchmark mode at the default dose (5 uM TNF, 1 uM TNFR1), which
# its action block carries commented out beside its SSA and PSA modes: one run from free TNF and
# receptor to 10,000 s in 100 steps, with NFsim's molecule cap lifted (gml). About 3,000 TNF
# trimers and 600 receptors; receptors bind within milliseconds, and the slower rearrangement among
# one-, two- and three-receptor complexes (koff = 0.01 /s) is what the grid follows.
