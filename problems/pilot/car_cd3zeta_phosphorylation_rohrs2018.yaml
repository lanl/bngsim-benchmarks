# CAR CD3zeta site-specific phosphorylation by LCK. A provisional pilot problem for partial scaling
# (PSA): it exercises the PSA capability until its core suite is chosen and audited
# (docs/DESIGN.md §3.2). Six-site phosphorylation of 20,000 CD3zeta by about 20 LCK (the seeded
# 19.703 is rounded to 20 by every stochastic engine) through Michaelis-Menten rate laws with
# competitive inhibition (functional propensities), 64 phosphoforms. LCK is a reactant of every
# reaction, so the smallest participating population is at most 20 and scaling can engage only at
# the smallest N_c. The protocol is ours, not the record's (its active action is the ODE time
# course over 1000 min, with exact SSA commented out beside it): an ensemble from the seed species
# over the first 60 min (time unit: minutes), when A1 is past half-maximal and C1 has begun.
