# The JNK/p38/ATF2 phosphoswitch, p38-ATF2 binding after anisomycin. A provisional pilot problem
# for forward sensitivities: it exercises the sens capability, and its two-phase protocol, until
# the sens-net core suite is chosen and audited (docs/DESIGN.md §3.2; the proposal's member 3).
# A published parameter-estimation problem: the authors' rule-based model, four rate constants
# fit to the p38-ATF2 NanoBit binding time course (Fig. 4a), the others held at their published
# values. The protocol is the job's own: equilibrate at basal MAPK activity (Stim = 0) for the
# 20000 s the authors' reproduction script uses, then stimulate (Stim = 1) and measure over the
# data's 0-2466 s on its 137 s grid. The fitted set has four members, so the problem is
# differentiated over every independent parameter (21: the 18 rate constants and the three
# protein totals), with the fitted four kept as a setting. Two rates are functions of the
# parameters through the Stim gate, which the protocol sets and so is not differentiated.
