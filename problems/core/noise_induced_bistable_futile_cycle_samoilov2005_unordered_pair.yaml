# Noise-induced bistable futile cycle, unordered-pair driver. A core problem: member 4 of the
# ssa-net suite and member 2 of the psa-net suite (docs/DESIGN.md §3.2). It replaces the paper's
# seed, the record's primary, whose driver N + N -> E+ + N fires at twice the convention under
# which this variant reproduces the paper's Fig. 3A (the primary has one mode where the paper has
# two; suites-stochastic.md §3.1, Q3). A repeated reactant (N + N), so libRoadRunner's gillespie,
# which fires k*N*N for it, is UNSUPPORTED by design (§5.3). Low copy numbers that drive it: E
# 0-20, N 0-10, beside X about 1.6-1.9e3 and X* 55-364.
# SSA: the record's own action (one exact trajectory over t = 0..10 s from the Fig. 3 caption
# state), as an ensemble, output every 0.05 s rather than every 0.005 s.
# PSA: the same window. The low-copy E and N take part in most reactions, so scaling barely
# engages: noise-induced bimodality is what over-aggressive scaling would erase.
