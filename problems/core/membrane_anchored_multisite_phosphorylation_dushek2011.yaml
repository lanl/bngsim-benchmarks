# Membrane-anchored multisite phosphorylation. A core problem: member 7 of the ss-net suite
# (docs/DESIGN.md §3.2). A linear network (a Markov chain over phosphorylation states with kinase
# and phosphatase bound or free), so its steady state is unique and the exact null space gives a
# reference at every dose. The dose is the kinase/phosphatase ratio r = E/F at fixed E + F, through
# derived initial amounts. The scan, horizon and tolerances are the file's own first parameter_scan
# (r 0.01 to 100, 41 points, log, to 1e5 s at rtol 1e-10, atol 1e-12): Fig. 2 D, the
# diffusion-limited regime, at the file's parameters.
# Also member 9 of the ssa-net suite. One substrate molecule with 20 identical sites, a kinase and a phosphatase
# held as parameters: every reaction is first order in that one molecule, so the network is a
# 143-state Markov chain, every occupancy is Bernoulli, and the SSA mean is the ODE solution. The
# twenty identical sites test the statistical factors; mid-size (143 species, 284 reactions) at
# the lowest copy number there is. The record has no SSA action, so the protocol is ours: a time
# course at the nominal r = [E]/[F] = 1 from the seed state (all sites free) over 1000 s, about
# the relaxation of total phosphorylation, output every 20 s.
# Exact moments are not declared: the harness's linear-moment solver stops at 40 species (the
# covariance system of 143 has 1e4 states). For a single molecule the variances follow from the
# means alone (p(1 - p)), which a moments kind of that name could use (open item).
