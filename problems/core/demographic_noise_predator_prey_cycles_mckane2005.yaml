# Demographic-noise predator-prey cycles. A core problem: member 2 of the ssa-net suite
# (docs/DESIGN.md §3.2). A finite-capacity individual-level model (N = 3200: 800 predators, 800
# prey, 1600 empty sites) whose mean field relaxes to coexistence while demographic noise drives
# resonantly amplified quasi-cycles: noise of individuals, not of molecules. Second-order
# (predation, birth into empty sites) reactions, so no exact moments; the references are the
# engines. The protocol is the record's own exact-SSA action (t = 0..1200, one output per time
# unit), run as an ensemble from the record's seed state rather than as one seeded trajectory.
