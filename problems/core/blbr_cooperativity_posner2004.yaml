# Bivalent anti-IgE (23G3) binding cell-surface IgE-FceRI with negative cooperativity (Posner et
# al. 2004; theory of Wofsy and Goldstein 1987). A core problem: member 9 of the
# nf-xml-aggregation suite (docs/DESIGN.md §3.2, suites-stochastic.md §2.4), its cooperativity
# member. The file's own protocol is a 20-dose parameter_scan over AT_nM, which no engine but
# BNG2.pl can replay; the suite runs one dose, the file's default AT_nM = 1 nM (900 receptors and
# ~1,800 antibodies in a 0.003 subvolume), with the scan's options (complex=>1, gml=>1000000) as a
# time course to 10 s (equilibrium ~0.1 s at kr = 10/s) in 50 steps.
