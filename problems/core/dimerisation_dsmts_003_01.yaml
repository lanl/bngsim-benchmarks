# Dimerisation, DSMTS model 003-01 (SBML Test Suite stochastic case 00030). A core problem:
# member 1 of the ssa-sbml suite (docs/DESIGN.md §3.2), the suite's exact-moments anchor.
# P + P -> P2 at k1*P*(P-1)/2 (k1 = 1e-3) and P2 -> 2 P at k2*P2 (k2 = 1e-2), from P = 100. The
# file, the exact mean and SD tables and the settings (start 0, duration 50, 50 steps, amounts
# of P and P2) are the case's own at sbmlteam/sbml-test-suite 473e119d (the files lanl/bngsim
# vendors byte-identically in harness/sbml_test_suite/dsmts/); the horizon is the settings'.
# The repeated reactant's law is written k1*P*(P-1)/2, which every engine fires as written, so
# libRoadRunner is not screened out. The compartment has no size (read as 1).
# Molecule counts (model preparation, every engine): every compartment has size 1 and an
# amount is a number of molecules; BNGsim and libRoadRunner read it so, and COPASI, which
# imports this file's amounts in #, has its quantity unit set to # (one particle per unit
# amount; the record names the imported unit). Compared: every species a reaction, rule or
# event changes, by SBML id.
# run_network: not applicable (the converter writes the non-mass-action law as per-species flux
# reactions, the same ODE with other jumps); the harness derives the network and records the
# reason in every result. size.ssa_ms_run_network is 0 for planning only.
