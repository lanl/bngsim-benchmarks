# Two-state gene expression noise. A core problem: member 6 of the ssa-net suite
# (docs/DESIGN.md §3.2). One constitutive transcript and three independently switching two-state
# promoters (single copies) whose transcripts share a steady-state mean of 25 but differ in shape
# (bimodal, long-tailed, near-Poisson); transcription is written with if() functional rate laws,
# so the moments do not close in the harness's reading and the references are the engines. The
# source study solved the same chemical master equation by finite-state projection rather than by
# SSA. The protocol is ours, not the record's (one fixed-seed trajectory over 1e8 s): an ensemble
# from the record's seed state over 20 transcript lifetimes (6000 s), the record's own burn-in,
# output every 30 s. Zeroth-order creation rules: run_network's PSA cannot run it (not in psa-net).
