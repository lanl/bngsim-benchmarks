# Genetic toggle switch. A core problem: member 1 of the ss-net suite (docs/DESIGN.md §3.2).
# Two mutually repressing genes with Hill repression, in dimensionless units: bistable for
# 14.76 < alpha_2 < 80.57 (at the file's alpha_1, beta, gamma), with two stable states and a saddle
# between them, so which steady state a solve returns depends on where it starts. The scan is the
# file's own parameter_scan of alpha_2 (1 to 500, 100 points, linear; 13 points bistable), the
# points the verification checks. Every point starts from the file's seed species, (0, 0), as BNG
# parameter_scan does; the horizon and tolerances are the verification's (t = 1000, rtol 1e-10,
# atol 1e-12), since the file's own scan integrates only to t = 20, which does not settle next to
# the folds. The verification covers both stable branches at every bistable point, so either branch
# a solve reaches from (0, 0) is checked; the suite runs the one the seed reaches.
id: genetic_switch_gardner2000
layer: core
title: "Genetic toggle switch"
source:
  repo: wshlavacek/BNGL-Models
  commit: 7d6d3660b9146abc49e45d6d21f08b59ad5d34ab
