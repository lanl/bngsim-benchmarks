# RPE-1 cell-cycle oscillator, fitted. A core problem: member 3 of the ode-net suite (docs/DESIGN.md §3.2).
# The file is the fused v3.2.0 network at the authors' fitted parameters and their PEtab wt
# condition, written mechanically from their release; the BNGsim paper's table used the
# `_fused` file, which carries the pre-fit nominal values (docs/core_suites.md).
# The protocol is the model's own ODE simulate action, at the same commit (time in seconds).
# Also member 9 of the sens-net suite: forward sensitivities over the same 0-136471.6 s horizon
# (two cell cycles) on a 300-step grid (every fourth point of the ODE protocol's 1200, which would
# hold about 1201 x 73 x 158 sensitivities per engine), at the ODE protocol's tolerances, the
# finite differences tighter still. The authors' fitted set is differentiated: the 114 kinetic
# rate constants and the 47 estimated initial concentrations of the PEtab wt condition (161; the
# 16 observation-model parameters reach no species). Three fitted rate constants sit at 0 at the
# optimum (kDpApc_1, kDpE2f1, kPhC25A) and are left out, as a zero has no relative step: 158.
