# p21-ROS feedback in DNA-damage senescence (BioModels BIOMD0000000287). A core problem: member
# 6 of the ssa-sbml suite. The paper's Fig. 3B is the mean and SD of 500 stochastic runs; the
# curators reproduced the deterministic Fig. S17 in COPASI over 0-10 days, the horizon here
# (864000 s). Three time-triggered events: irradiation IR = 200 at t >= 172800 s, IR = 0 at
# t >= 172860 s, kp38ROS = 0.6 at t >= 691200 s; the output rows at 172800 s and 691200 s,
# instants an event fires, are left out of every comparison. Each trajectory costs minutes
# (about 1.35e8 reaction events), so replicates is 100 (decided 2026-11-24) and the correctness
# job runs each engine as its own Slurm array task (its parts, bench.capabilities.ssa).
# libRoadRunner runs it and warns that its time events are not precise (recorded).
# Molecule counts (model preparation, every engine): every compartment has size 1 and an
# amount is a number of molecules; BNGsim and libRoadRunner read it so, and COPASI, which
# imports this file's amounts in #, has its quantity unit set to # (one particle per unit
# amount; the record names the imported unit). Compared: every species a reaction, rule or
# event changes, by SBML id.
# run_network: not applicable (the derived protocol sets kp38ROS, a parameter the converter
# promotes to a species, to 0.6 between phases, and run_network's SSA rounds it to 1 (wave-1
# probe, Slurm job 17413393)); the harness derives the network and records the reason in every
# result. size.ssa_ms_run_network is 0 for planning only.
