# TCR signaling bistability. A core problem: member 2 of the ode-net suite (docs/DESIGN.md §3.2).
# The model's only live simulate is SSA; the protocol is its ODE simulate, which the file
# keeps commented out and the verification notebook runs in its place (time in seconds
# since stimulation). The model body is the same either way.
# Also member 10 of the nf-xml-signaling suite (suites-stochastic.md §2.5), its high-particle
# finite anchor: 925,633 particles on a 37-species network, so exact SSA on it is a reference. A
# network-free trajectory of the ssa protocol's 600 s costs an engine 42-60 s (cost probe,
# 2026-11-24), so 100 would outrun the hour each engine has; the nf protocol is its first 200 s,
# output every 10 s, the same for every engine.
