# TCR signaling bistability. A core problem: member 2 of the ode-net suite (docs/DESIGN.md §3.2).
# The model's only live simulate is SSA; the protocol is its ODE simulate, which the file
# keeps commented out and the verification notebook runs in its place (time in seconds
# since stimulation). The model body is the same either way.
# Also member 7 of the ssa-net suite and member 5 of the psa-net suite. SSA and PSA: the record's
# live SSA action (30 agonist pMHC on the primed state) over its first 20 min rather than its
# 3 h, output every 20 s. A cost decision: one exact trajectory over 3 h is 1.3e8 events (bngsim
# 70 s, run_network 133 s on a Darwin node), so even the smallest admissible ensemble (100) would
# pass the harness's one-hour budget per engine; at 20 min it is 8 s and 15 s. The deterministic
# switch completes inside that window (ppERK 2.6e5 at 10 min, overshooting its 2.2e5 plateau),
# so the ensemble still samples which cells switch. Populations 10 (pMHC) to 3e5 (ERK). The
# file's verification is deterministic; its stochastic behaviour is checked in the job (Q1).
