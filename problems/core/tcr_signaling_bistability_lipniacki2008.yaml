# TCR signaling bistability. A core problem: member 2 of the ode-net suite (docs/DESIGN.md §3.2).
# The model's only live simulate is SSA; the protocol is its ODE simulate, which the file
# keeps commented out and the verification notebook runs in its place (time in seconds
# since stimulation). The model body is the same either way.
# Also member 4 of the ss-net suite: the steady states over N_agonist = 1 to 1000 (20 points, log),
# the verification's doses, bistable for 8.845 < N < 772.1 (13 of the 20). Every point starts from
# the file's seed species (the primed, ligand-free cell given N agonists), which reaches the ERK-high
# branch exactly above the lower fold; the horizon and tolerances are the verification's (2e6 s,
# rtol = atol = 1e-10). Its steady-state evidence is at BNGL-Models 7d6d366, where the .bngl is
# byte-identical to the pinned one.
