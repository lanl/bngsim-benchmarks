# Bursty autoregulated gene expression. A core problem: member 1 of the ssa-net suite and member 1
# of the psa-net suite (docs/DESIGN.md §3.2); it entered both as a pilot and keeps the pilot's
# protocols, so its pilot results stay current.
# Protein activates its own transcription through a Hill function (a functional rate), so its
# moments do not close and the references are the engines alone. Copy numbers are low and bursty:
# a few transcripts each hour, each translated into a burst of about 40 proteins. The protocol is
# ours, not the record's: an ensemble from the network's seed species (no mRNA or protein) over one
# protein lifetime (the model's dilution time, 3600 s), where the record first relaxes the
# deterministic model and then samples one long trajectory.
# PSA: low-copy mRNA (0-5) beside a protein that reaches about 1100, whose bimodal stationary
# distribution over-aggressive scaling would distort. The PSA protocol runs ten protein lifetimes
# (36000 s) from the seed species, to reach that distribution. The record notes that BioNetGen's
# PSA aborts on the zeroth-order transcription rule; that is recorded, not worked around.
