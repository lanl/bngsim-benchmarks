# DNA damage repair by non-homologous end joining and p53/p21-mediated early senescence (Dolan et
# al. 2015). A core problem: member 4 of the nf-xml-signaling suite (docs/DESIGN.md §3.2,
# suites-stochastic.md §2.5; the bngsim paper's B33): 74 molecule types, 2,355 rules (the
# record's metadata says 2,339), 121 function rate laws, about 2,341 particles; its network is
# unbounded. The file's own action is one network-free run of 2,400 min (time unit: minutes),
# which costs an engine 400-700 s per trajectory (cost probe of the record's check, 2026-11-24),
# so 100 would outrun the hour each engine has many times over. The protocol is its first 240
# min, output every 10 min, the same for every engine: about 26 s per trajectory through BNG2.pl
# (NFsim itself 11 s), 24 s for BNGsim's nf_reject and 16 s for its RuleMonkey, on loaded nodes.
