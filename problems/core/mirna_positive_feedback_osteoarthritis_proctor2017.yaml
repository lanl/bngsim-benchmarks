# MicroRNA positive feedback in osteoarthritis (BioModels BIOMD0000000862, model 0). A core
# problem: member 4 of the ssa-sbml suite. Curated in COPASI 4.24 (Supplementary Fig. A(i),
# 0-8 h); the horizon is that, 28800 s, as the curators' SED-ML runs it (100 steps). Two
# time-triggered events set Signal to 100 at t > 3600 s and back to 0 at t > 7200 s: the
# output row at 7200 s, an instant an event fires, is left out of every comparison (before or
# after the event is a convention). libRoadRunner's gillespie fires a time event at its first
# reaction event after the trigger and warns that this is not precise; it is run, and its
# warning recorded (decided 2026-11-24). A probe at 300 per engine found no disagreement.
# Molecule counts (model preparation, every engine): every compartment has size 1 and an
# amount is a number of molecules; BNGsim and libRoadRunner read it so, and COPASI, which
# imports this file's amounts in #, has its quantity unit set to # (one particle per unit
# amount; the record names the imported unit). Compared: every species a reaction, rule or
# event changes, by SBML id.
# run_network: not applicable (the converter writes non-mass-action laws as per-species flux
# reactions, the same ODE with other jumps); the harness derives the network and records the
# reason in every result. size.ssa_ms_run_network is 0 for planning only.
