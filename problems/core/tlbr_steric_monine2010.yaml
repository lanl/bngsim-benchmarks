# Trivalent ligand, bivalent receptor on mast cells, fit to Monine et al. (2010) Fig. 2a (the
# equivalent-site acyclic TLBR model; the paper's steric Models I-III are not encoded). A core
# problem: member 8 of the nf-xml-aggregation suite (docs/DESIGN.md §3.2, suites-stochastic.md
# §2.4). The file's own protocol is a 12-dose parameter_scan, which no engine but BNG2.pl can
# replay; the suite runs the record's single-dose alternative, which its action block carries
# commented out: the default LT_conc = 7 nM (300 receptors and ~4,200 ligands in a 0.001
# subvolume), network-free to 5000 s (equilibrium) in 250 steps, -bscb.
id: tlbr_steric_monine2010
layer: core
title: "Trivalent antigen aggregating IgE-FceRI on mast cells"
source:
  repo: wshlavacek/BNGL-Models
  commit: 7d6d3660b9146abc49e45d6d21f08b59ad5d34ab
  path: models/tlbr_steric_monine2010/tlbr_steric_monine2010.bngl
