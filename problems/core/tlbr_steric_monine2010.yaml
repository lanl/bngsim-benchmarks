    actions: |
      simulate({method=>"nf",suffix=>"nfr",t_start=>0,t_end=>5000,n_steps=>250,gml=>2147483647,print_functions=>1,param=>"-bscb"})
    replicates: 500
    timing_replicates: 10
    seed: 1
size:
