  format: bngl
publications:
  - citation: "Monine MI, Posner RG, Savage PB, Faeder JR, Hlavacek WS (2010). Modeling multivalent ligand-receptor interactions with steric constraints on configurations of cell-surface receptor aggregates. Biophys J 98:48-56."
    doi: 10.1016/j.bpj.2009.09.043
verification:
  kind: data
  evidence: >-
    models/tlbr_steric_monine2010/verify_monine2010.ipynb and run_monine2010.py
  check: >-
    24 fresh BNG2.pl NFsim scans (seeds 1000-1023, each in its own run directory, asserted distinct) at the 12 Fig. 2a doses against the published CSV: RMS lambda < 0.02 (Monine's own acceptance criterion, SI Eq. 11) with a margin of more than 3 bootstrap SE, asserted
  result: >-
    RMS lambda 0.0153 +- 0.0005 (margin 9.4 SE); the old cache, which a shared-directory glob had left with 1 distinct scan of 5, read 0.0124
  pending: >-
    BNGL-Models branch verify-tlbr_steric_monine2010-replicates @ 936660b (not merged; the .bngl is unchanged): pin the merged sha in this evidence when it lands (TODO)
capabilities: [nf]
protocol:
