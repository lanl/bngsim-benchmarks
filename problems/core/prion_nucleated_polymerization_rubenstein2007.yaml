# Prion nucleated polymerization. A core problem: member 8 of the ssa-net suite
# (docs/DESIGN.md §3.2). It replaces the paper's seed, the record's _benchmark variant, which has
# no stochastic check (_benchmark moves to psa-net; suites-stochastic.md §3.1, Q5). 600 PrPC
# and three seed trimers: nucleation and extinction are the paper's own stochastic claim (a
# trajectory either takes off or loses its three seeds), on a network truncated at 40 subunits.
# The protocol is the record's own exact-SSA action (one year at the Table 1 parameterization,
# a = 0.047/day), as an ensemble, output daily rather than every 6 h. Time unit: days.
# run_network's PSA segfaults on this network at t = 0 (probe, 2026-11-24); not in psa-net.
# Also member 2 of the nf-xml-aggregation suite (suites-stochastic.md §2.4), its polymerization
# member with turnover (synthesis, degradation and fragmentation). Its network is unbounded, but
# exact SSA on the network truncated at 40 subunits is the same law to within the chain-length
# tail, which is negligible: in a BioNetGen SSA run to 365 days no chain ever exceeded 27
# subunits and 2e-4 of the aggregates at day 365 held 20 or more (probe, 2026-11-24), so both
# exact-SSA engines are references for the network-free run. Its nf protocol is the ssa one, as
# a network-free run (the file's own NF route is none: its actions are SSA only), output every
# 5 days.
