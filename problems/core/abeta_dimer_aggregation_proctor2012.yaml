# Amyloid-beta dimer aggregation (BioModels BIOMD0000000462). A core problem: member 2 of the
# ssa-sbml suite. A stochastic model by its authors; the curators reproduced Figs 5A and 5B with
# COPASI's stochastic direct method over 0-100 years. The horizon is that: 3.156e9 s (100 y;
# the file declares no time unit, so seconds). Rate laws are written per molecule count,
# dimerisation as k*X*(X-1)*0.5. replicates is 5000, not the 1e4 default (cost, decided
# 2026-11-24); a probe at 200 per engine (wave 1) found no disagreement between the engines.
# Molecule counts (model preparation, every engine): every compartment has size 1 and an
# amount is a number of molecules; BNGsim and libRoadRunner read it so, and COPASI, which
# imports this file's amounts in #, has its quantity unit set to # (one particle per unit
# amount; the record names the imported unit). Compared: every species a reaction, rule or
# event changes, by SBML id.
# run_network: not applicable (the converter writes non-mass-action laws as per-species flux
# reactions, the same ODE with other jumps); the harness derives the network and records the
# reason in every result. size.ssa_ms_run_network is 0 for planning only.
