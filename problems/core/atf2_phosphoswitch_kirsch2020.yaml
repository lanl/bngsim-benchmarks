# The JNK/p38/ATF2 phosphoswitch, p38-ATF2 binding after anisomycin. A core problem: member 3 of
# the sens-net suite (docs/DESIGN.md §3.2; docs/core_suites.md). A published parameter-estimation
# problem: the authors' rule-based model, four rate constants fit to the p38-ATF2 NanoBit binding
# time course (Fig. 4a), the others held at their published values. The protocol is the
# authors' own: equilibrate at basal MAPK activity (Stim = 0) for 20000 s, then stimulate
# (Stim = 1) and measure over the data's 0-2466 s on its 137 s grid -- two finite phases, the
# sensitivities carried across t = 0 (D3b). The equilibration is finite because the network has
# an absorbing state and never reaches a steady state. The fitted set has four members, so the
# problem is differentiated over every independent parameter (21: the 18 rate constants and the
# three protein totals; D3c), with the fitted four kept as a setting. Two rates are functions of
# the parameters through the Stim gate, which the protocol sets and so is not differentiated.
