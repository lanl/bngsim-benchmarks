  format: bngl
publications:
  - citation: "Goldstein B, Wofsy C (1980). Theory of equilibrium binding of a bivalent ligand to cell surface antibody: the effect of antibody heterogeneity on cross-linking. J Math Biol 10:347-366."
    doi: 10.1007/BF00276093
verification:
  kind: theory
  evidence: >-
    models/blbr_heterogeneity_goldstein1980/verify_goldstein1980.ipynb
  check: >-
    NFsim (BNG2.pl) x_poly at 18 doses, 10 seeds each, against Goldstein-Wofsy Eqs. 13-14 (Fig. 5, X_T = 500)
  result: >-
    max abs error 0.047 (printed against 0.20 at 676dd61)
  pending: >-
    upstream branch verify-blbr_heterogeneity_goldstein1980-* (BNGL-Models, not merged): fixes the renamed file in cell [5] and asserts; pin the merged sha here when it lands (TODO)
