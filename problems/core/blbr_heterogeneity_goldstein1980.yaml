      simulate({method=>"nf",suffix=>"nfr",t_start=>0,t_end=>10,n_steps=>50,gml=>2147483647,print_functions=>1,param=>"-bscb"})
    replicates: 1000
    timing_replicates: 20
    seed: 1
size:
