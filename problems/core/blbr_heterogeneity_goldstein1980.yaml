# Bivalent ligand cross-linking two populations of cell-surface antibody (Goldstein and Wofsy
# 1980). A core problem: member 1 of the nf-xml-aggregation suite (docs/DESIGN.md §3.2,
# suites-stochastic.md §2.4), the smallest by particle count: 25 + 25 antibodies (X_T = 500 per
# cell in a 0.1 subvolume). Its network is unbounded (chains). The file's own protocol is an
# 18-dose parameter_scan, which no engine but BNG2.pl can replay; the suite runs one dose, the
# file's default LT_conc_M = 1e-8 M (near the peak of Fig. 5's bell-shaped curve, x_poly about
# 0.72), as a time course to 10 s (equilibrium; characteristic time ~5/koff = 0.5 s) with the
# scan's flags (-bscb, gml). At this dose LT/RT >= 100, so the file's excess-ligand mode treats
# free ligand as a constant bath (pseudo-first-order capture): the particles are the 50
# antibodies and the ligands they hold.
id: blbr_heterogeneity_goldstein1980
layer: core
title: "Bivalent ligand on heterogeneous cell-surface antibody"
source:
