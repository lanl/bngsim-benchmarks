  - citation: "Hlavacek WS, Redondo A, Wofsy C, Goldstein B (2002). Kinetic proofreading in receptor-mediated transduction of cellular signals: receptor aggregation, partially activated receptors, and cytosolic messengers. Bull Math Biol 64:887-911."
