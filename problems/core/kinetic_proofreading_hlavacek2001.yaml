# Kinetic proofreading in receptor signaling. A core problem: member 3 of the ss-net suite
# (docs/DESIGN.md §3.2). The steady-state protocol is a koff dose-response on a log grid (1e-3 to
# 1 /s, 20 points), the verification's: the closed form D_i/D = alpha^i (1 - alpha) gives an exact
# steady state at every dose. The horizon and tolerances are the verification's (20000 s, rtol =
# atol = 1e-10); the file's own 30-point scan integrates to 1000 s, which has not settled below
# koff ~ 0.05 /s. The ode protocol is the model's own ODE simulate action, at the same commit; it
# is in no suite (it was a pilot problem, kept for the end-to-end tests).
id: kinetic_proofreading_hlavacek2001
