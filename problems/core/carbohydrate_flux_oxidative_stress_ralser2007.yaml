# Dynamic rerouting of the carbohydrate flux under oxidative stress (glycolysis and pentose
# phosphate pathway) (BioModels BIOMD0000000247). A core problem: member 10 of the
# ss-sbml suite (docs/DESIGN.md §3.2; ~/wt/proposals/suites-deterministic.md §2.4). The file
# is the curated BioModels file as sys-bio/temp-biomodels holds it, at the commit ode-sbml pins;
# its curation note (final/BIOMD0000000247/curation_notes.txt there) names a steady-state
# figure. The dose grid follows the curation note; the protocol's horizon and tolerances are
# the suite's (docs/core_suites.md, ss-sbml).
# Glycolysis and the pentose phosphate pathway in two compartments (24 dynamic species). The
# scan is the relative TPI activity k_rel_TPI. At 0.1 BNGsim finds no steady state within
# 1e6 (DHAP still growing, past 4e6) while 0.2 converges, so the grid stops at 0.25.
