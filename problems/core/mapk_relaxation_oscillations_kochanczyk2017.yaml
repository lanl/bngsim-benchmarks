# MAPK relaxation oscillations. A core problem: member 4 of the psa-net suite (docs/DESIGN.md
# §3.2), one of the three published models of the PSA paper (Lin, Feng & Hlavacek 2019). It
# leaves ssa-net (suites-stochastic.md §3.1, Q4): its record declares no exact-SSA action, and
# exact SSA is about 1e8 events per simulated 10 min. Populations 6e3-3e6. The protocol is the
# record's own PSA alternative (EGF 20 pg/ml from the primed state, poplevel 100 there) cut from
# its first hour to its first 10 min, output every 10 s: an exact trajectory over 10 min costs
# 49 s (bngsim) and 43 s (run_network) on a Darwin node, a scaled one 1.5-5.5 s, so exact SSA has
# its own, smaller ensemble (exact_replicates). The file's verification is deterministic (Fig.
# 4B); its stochastic behaviour is checked in the job (Q1).
id: mapk_relaxation_oscillations_kochanczyk2017
