# BLBR aggregation with explicit ring closure (Posner, Wofsy and Goldstein 1995). A core problem:
# member 7 of the nf-xml-aggregation suite (docs/DESIGN.md §3.2, suites-stochastic.md §2.4), the
# suite's explicit-ring member. About 33,000 particles; open chains are unbounded, and rings close
# by their own unimolecular rules. The protocol is the file's own action: one network-free run to
# 3000 s in 300 steps, its seed replaced, with -bscb and -utl 5 (NFsim's automatic traversal limit
# of 4 is too shallow for the ring patterns: RuleWorld/nfsim#52).
id: blbr_rings_posner1995
