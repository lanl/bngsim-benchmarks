# Phage-lambda lysis-lysogeny decision, the full circuit, paper-exact variant (after Arkin, Ross
# and McAdams 1998). A core problem: member 3 of the nf-xml-signaling suite (docs/DESIGN.md §3.2,
# suites-stochastic.md §2.5; the bngsim paper's B36). A gene circuit with functional rates,
# elongation counters (loc~PLUS states) and growth dilution; its network cannot be generated
# (2,284 counter states). The file's action block only writes the XML; the record's Fig. 6a run
# goes to 2100 s (35 min, the decision time) at the file's default MOI 6, but there one
# trajectory costs BNGsim's nf_reject 140 s (BNGsim's RuleMonkey 3.8 s; cost probe 2026-11-24),
# so 100 would outrun the hour each engine has. The protocol is that run's first 300 s at MOI 6
# (6.8 s a trajectory), in 10-s steps, the same for every engine: the circuit's early transcription
# and dimerization, not the decision. 1,212 particles at the start.
# Known reference gaps, recorded, never worked around: stock NFsim 1.14.3 fires a symmetric
# functional-rate rule at the wrong rate (the bug bngsim fixed as lanl/bngsim#195; a three-species
# reproducer gives 500.2 +- 2.0 against an exact 1000.2), and the file's dimer dilution rules have
# that shape; and BNG2.pl's simulate_nf reports the run as failed after it completes, because
# NFsim writes notes about the ~PLUS states to stderr. So the nfsim reference is REFERENCE_FAILED
# here, and with RuleMonkey of BNGsim's own lineage this member can neither pass nor be refuted.
id: lambda_switch_arkin1998_fullcircuit_exact
