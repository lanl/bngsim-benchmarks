  evidence: models/lambda_switch_arkin1998/verify_arkin1998.ipynb and run_fullcircuit.py
  check: >-
    Fig. 6a (lysis fraction vs MOI, "Full"), digitized from the journal scan
    (digitize_arkin1998.py), against stock NFsim 1.14.3 run on the file's writeXML() output,
    200 seeds per MOI at MOI 1-8, 10, 12, |z| <= 3.29 fixed before the run; the symmetric
    functional-rate defect of stock NFsim asserted on a reproducer
  result: >-
    NO ADMISSIBLE CHECK. MOI 1-3 pass (MOI 3 at z 3.22); MOI 4-12 lie above the published curve
    (z 4.2-8.6), asserted as a finding, and stock NFsim carries the symmetric-dimer defect this
    file's dilution rules trigger, so it is not a valid reference for it. The values the record
    quoted as the paper's (0.30/0.55/0.70 at MOI 4/5/6) are not in the paper (digitized:
    0.171/0.386/0.456)
  pending: >-
    BNGL-Models branch verify-lambda_switch_arkin1998-fullcircuit-exact-nfsim @ d36d401 (not
    merged; the .bngl is unchanged). Whether to keep B36 or swap in a reserve (Blinov 2006,
    kinetic proofreading; suites-stochastic.md §3.1) is the user's call (Q11)
