# Noise-resistant circadian oscillator, read as Antimony. A core problem: member 1 of the
# ode-antimony suite (docs/DESIGN.md §3.2, docs/core_suites.md), derived from member 1 of ode-net
# (noise_resistant_circadian_oscillator_vilar2002). The model, its pin, its evidence and its ODE
# protocol are that member's (bench checks that they stay equal); the .ant is converted from it at
# job time, and its sha256 is recorded in every result.
