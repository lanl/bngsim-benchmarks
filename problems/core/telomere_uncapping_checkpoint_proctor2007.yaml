# The checkpoint response to telomere uncapping in budding yeast (BioModels BIOMD0000000087).
# A core problem: member 9 of the ssa-sbml suite. The curators reproduced Fig. 5 with
# Gillespie 2.0 over about 0-43000 s; the horizon is 43200 s (12 h). Nine state-triggered
# events (thresholds on molecule counts) drive the cell cycle. A wave-1 probe found COPASI far
# from BNGsim and libRoadRunner here (n = 10: Mec1RPAssDNA 0 against 30, budscar 12.9 against
# 8.0, the curation figure's 8 divisions), which, if it holds, is a DIFF attributed to COPASI's
# event handling: recorded, not worked around. replicates is 4000 (decided 2026-11-24).
# Molecule counts (model preparation, every engine): every compartment has size 1 and an
# amount is a number of molecules; BNGsim and libRoadRunner read it so, and COPASI, which
# imports this file's amounts in #, has its quantity unit set to # (one particle per unit
# amount; the record names the imported unit). Compared: every species a reaction, rule or
# event changes, by SBML id.
# run_network: not applicable (bngsim.convert.sbml_to_bngl refuses its state-triggered events);
# the harness derives the network and records the reason in every result.
# size.ssa_ms_run_network is 0 for planning only.
