# EGFR ectodomain oligomerization with rings, coupled to phosphorylation (Mitra et al. 2019,
# fit to Kozer et al. 2013). A core problem: member 10 of the nf-xml-aggregation suite
# (docs/DESIGN.md §3.2, suites-stochastic.md §2.4), the largest by particle count: about 3.0e5
# EGF against ~900 receptors at the default 30 nM in the f = 0.01 subvolume. The protocol is the
# first quarter of the file's own time course: 30 nM, network-free to 150 s (the file runs 600 s,
# Fig. 3B/3D) in 10-s steps, -bscb -utl 5. The whole 600 s costs one engine about a minute per
# trajectory (2.1e6 events, ~3.5e3 per simulated second, steady; RuleMonkey 55 s, nf_exact 60 s on
# a general node), so 100 trajectories would outrun the harness's one-hour budget per engine; the
# cost does not fall with the dose (1 nM costs as much), so the window is cut, the same for every
# engine, rather than the model. Clustering is still evolving at 150 s (monomers 134 -> ~120).
# The file's other protocol, a 6-dose parameter_scan, no engine but BNG2.pl can replay.
id: egfr_oligomerization_mitra2019
layer: core
title: "EGFR higher-order oligomerization coupled to phosphorylation"
source:
  repo: wshlavacek/BNGL-Models
  commit: 7d6d3660b9146abc49e45d6d21f08b59ad5d34ab
  path: models/egfr_oligomerization_mitra2019/egfr_oligomerization_mitra2019.bngl
  sha256: 23ed0c39e61f9bcdb56277ccbb41c4e55cf08b770ccc713580f2e952e75e7df6
  format: bngl
publications:
  - citation: "Mitra ED, Suderman R, Colvin J, Ionkov A, Hu A, Sauro HM, Posner RG, Hlavacek WS (2019). PyBioNetFit and the Biological Property Specification Language. iScience 19:1012-1036."
    doi: 10.1016/j.isci.2019.08.045
  - citation: "Kozer N, Barua D, Orchard S, Nice EC, Burgess AW, Hlavacek WS, Clayton AHA (2013). Exploring higher-order EGFR oligomerisation and phosphorylation -- a combined experimental and theoretical approach. Mol BioSyst 9:1849-1863."
    doi: 10.1039/c3mb70073a
verification:
  kind: data
  evidence: >-
    models/egfr_oligomerization_mitra2019/verify_mitra2019.ipynb and run_mitra2019.py
  check: >-
    BNG2.pl NFsim, 24 time-course and 24 dose-response replicates (distinct seeds, each in its own run directory), scaled and compared with the Kozer 2013 average-normalized data (Figs. 2B, 2D, 3B, 3D): total chi^2 < 30, asserted
  result: >-
    chi^2 13.90 +- 0.50 (Fig. 3B 3.40, 3D 4.72, 2B 2.53, 2D 3.24; the published fit scores 13.4); the old cache (4 distinct replicates of 6) read 14.91
  supporting: >-
    the record's own contrast, not evidence here: BNG2.pl's NFsim 1.14.3 reads 12.0% below RuleMonkey on pEGFR (281 against 317 at 1 nM)
  pending: >-
    BNGL-Models branch verify-egfr_oligomerization_mitra2019-replicates @ 5b8ebb1 (not merged; the .bngl is unchanged): pin the merged sha in this evidence when it lands (TODO)
capabilities: [nf]
protocol:
