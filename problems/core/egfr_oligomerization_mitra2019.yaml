    actions: |
      simulate({method=>"nf",suffix=>"nfr",t_start=>0,t_end=>150,n_steps=>15,gml=>2147483647,print_functions=>1,param=>"-bscb -utl 5"})
    replicates: 120
    timing_replicates: 2
    seed: 1
size:
  nf_events: 1500000
suites:
  nf-xml-aggregation: 10
