# EGFR ectodomain oligomerization with rings, coupled to phosphorylation (Mitra et al. 2019,
# fit to Kozer et al. 2013). A core problem: member 10 of the nf-xml-aggregation suite
# (docs/DESIGN.md §3.2, suites-stochastic.md §2.4), the largest by particle count: about 3.0e5
# EGF against ~900 receptors at the default 30 nM in the f = 0.01 subvolume. The protocol is the
# first quarter of the file's own time course: 30 nM, network-free to 150 s (the file runs 600 s,
# Fig. 3B/3D) in 10-s steps, -bscb -utl 5. The whole 600 s costs one engine about a minute per
# trajectory (2.1e6 events, ~3.5e3 per simulated second, steady; RuleMonkey 55 s, nf_exact 60 s on
# a general node), so 100 trajectories would outrun the harness's one-hour budget per engine; the
# cost does not fall with the dose (1 nM costs as much), so the window is cut, the same for every
# engine, rather than the model. Clustering is still evolving at 150 s (monomers 134 -> ~120).
# The file's other protocol, a 6-dose parameter_scan, no engine but BNG2.pl can replay.
id: egfr_oligomerization_mitra2019
layer: core
title: "EGFR higher-order oligomerization coupled to phosphorylation"
