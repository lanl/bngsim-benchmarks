# CaMKII holoenzyme activation with PP1. A core problem: member 6 of the ss-net suite (docs/DESIGN.md
# §3.2). The record's _pp1 variant: the hexamer ring with a Michaelis-Menten PP1, which reaches a true
# (non-equilibrium) steady state. The dose is the buffered ($-clamped) CaM4, through its total
# CaM4_tot. The scan, horizon and tolerances are the file's own parameter_scan (CaM4_tot 1e-4 to 1 uM,
# 25 points, log, to 20000 s at rtol 1e-10, atol 1e-14): the middle curve of Fig. 5a, at 1 uM PP1.
