# cSTAR SKMEL-133 melanoma signalling network, ERK inhibitor arm. A core problem: member 5 of the
# sens-net suite (docs/DESIGN.md §3.2; docs/core_suites.md). The PyBNF job's file
# (cstar_skmel133_bmra_exact), the authors' SKMEL-133-3.bngl in edition-2 form: the connection
# coefficients fitted to the single-drug fold changes under the BMRA sign constraints, with the
# DPD phenotype coordinate S whose force is an if() piecewise function of the state. The protocol
# is the authors' published one (their actions block, which the upstream check runs verbatim):
# 86400 s with every inhibitor at 0, then the ERK inhibitor at dose 1 for 86400 s, measured on
# their 100 s grid; a finite equilibration (the upstream check finds it within 3.0e-5 of the
# steady state). Dose 1 of the ERK inhibitor is the job's first experiment and the authors' first
# 86400 s arm. The job routes the ERK, AKT and SRC inhibitors through parameters its rate laws
# read (I_ERK_conc in the ERK phosphorylation rate), so the arm is a parameter change between
# phases (its inhibitor species $IERK(ERKBD), seeded by I_ERK_conc, takes part in no reaction).
# The fitted set (43) is differentiated, less the three DPD force coefficients beta_SRC,
# beta_mTOR and beta_PKC, which the file writes as derived (x / phen_scale) and so cannot be
# differentiated as parameters: 40 (the 20 crosstalk strengths g_XY and their 20 K_XY). Tight
# tolerances, as the upstream check advises for the cSTAR models (BNG's defaults err up to 4.4e-6
# here, 1.45e-2 on TrkB), and finite differences tighter still.
