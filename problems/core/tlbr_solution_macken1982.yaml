# Trivalent ligand, bivalent receptor (TLBR) aggregation in solution (Macken and Perelson 1982).
# A core problem: member 4 of the nf-xml-aggregation suite (docs/DESIGN.md §3.2,
# suites-stochastic.md §2.4). 4,200 ligands and 300 receptors; the aggregates are acyclic
# (-bscb) and unbounded, so there is no network. The protocol is the file's own action: one
# network-free run from all-free molecules to 500 s (equilibrium after ~300 s) in 250 steps,
# its seed replaced per trajectory. The record's theory is the strongest aggregate-size theory
# in the suite (branching process, Theorem 1).
