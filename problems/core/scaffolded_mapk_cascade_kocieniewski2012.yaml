# Scaffolded MAPK cascade. A core problem: member 4 of the ode-net suite (docs/DESIGN.md §3.2).
# The protocol is the model's own ODE simulate action, at the same commit.
# Also member 7 of the psa-net suite: uniformly large populations (1e5-5e5). PSA: the ODE
# protocol's start, its first 50 s, output every 1 s: an exact trajectory over 100 s is 1e7
# events (bngsim 14 s, run_network 15.5 s on a Darwin node), and bngsim's PSA runs no faster
# here (10-18 s), so twelve ensembles over the full 500 s would not fit one job.
