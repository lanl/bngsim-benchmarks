# Reduced canonical NF-kB pathway, TNF on-off protocol. A core problem: member 1 of the sens-net
# suite (docs/DESIGN.md §3.2; docs/core_suites.md). The authors' own six-variable reduced model
# (S1 Code, fitted_reduced_model_on_off_protocol.bngl) in the PyBNF job's edition-2 form: the
# authors' setParameter("TR") phases are a TNF switch read from an inert clock species
# (TRfunc() = if(simtime < t_tnf_off, 1, 0)), so the protocol is a single phase from the job's
# resting seed state (an exact steady state at TR = 0): TNF on for 0-7200 s, off to 43200 s,
# measured on the 300 s grid of its upstream check (145 points). The smallest member, and the
# only one whose rates switch mid-run. The 13 parameters fitted in the paper (Table 1) are
# differentiated (the fitted set is above 10, D3c); the switch time t_tnf_off is the protocol's,
# not fitted, and not differentiated. Wild type only (the A20-knockout arm is c_deg = 0).
