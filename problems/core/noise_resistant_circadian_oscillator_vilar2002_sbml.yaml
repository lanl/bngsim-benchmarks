# The noise-resistant circadian oscillator (BioModels BIOMD0000000035): Vilar et al.'s model
# as SBML. A core problem: member 5 of the ssa-sbml suite (the same model in BNGL is in
# problems/core/noise_resistant_circadian_oscillator_vilar2002.yaml). Curated with COPASI 4.5
# (Fig. 2AB, 0-400 h); the horizon is that, 400 (the time unit is the hour). All laws are mass
# action, so the network derived from the SBML has the SBML's jumps and run_network applies
# (the only member where it does; planned at 0.58 s a trajectory, the bench-node smoke's).
# EmptySet is a boundary species no reaction changes: not compared.
# Molecule counts (model preparation, every engine): every compartment has size 1 and an
# amount is a number of molecules; BNGsim and libRoadRunner read it so, and COPASI, which
# imports this file's amounts in moles, has its quantity unit set to # (one particle per unit
# amount; the record names the imported unit). Compared: every species a reaction, rule or
# event changes, by SBML id.
