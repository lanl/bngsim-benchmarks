# Noise-resistant circadian oscillator. A core problem: member 1 of the ode-net suite, member 5 of
# the ssa-net suite and member 3 of the psa-net suite (docs/DESIGN.md §3.2).
# The ODE protocol is the model's own ODE simulate action, at the same commit (time in hours).
# SSA: the record's own exact-SSA action (t = 0..400 h from the empty state), as an ensemble,
# output every 0.5 h rather than every 0.1 h. Single-copy genes, mRNA below one molecule on average
# beside about 2e3 proteins; the BNGL twin of ssa-sbml's BIOMD0000000035 (9 species here, 10 there).
# PSA: the same window: single-copy genes that must stay exact beside scaled proteins.
# The stochastic evidence is the record's at BNGL-Models 7d6d366 (wshlavacek/BNGL-Models#73); the
# file is byte-identical to the pinned commit's.
id: noise_resistant_circadian_oscillator_vilar2002
layer: core
title: "Noise-resistant circadian oscillator"
source:
