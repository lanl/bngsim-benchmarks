  evidence: models/noise_resistant_circadian_oscillator_vilar2002/verify_vilar2002.ipynb
  check: "independent SciPy LSODA integration of the paper's Eq. 1 (parameters from the Fig. 1 caption, not read from the .net) vs the BioNetGen ODE, tolerance 1e-6"
  result: "max relative error 2.6e-7"
  supporting: "data: digitized Fig. 2a/2b, RMSE/panel height 0.030 (A) and 0.038 (R) against a stated 0.06"
  stochastic: "equations: 64 BioNetGen SSA seeds vs 16 independent Gillespie runs, mean peak R and period in three regimes, worst |z| 1.13 (Welch-t, 1% family-wise); data: eight statistics of the five published realizations inside t(n-1) prediction intervals of a 64-replicate ensemble, worst |z| 1.62 (tol 3.38); all asserted (verify_vilar2002.ipynb at 7d6d366)"
capabilities: [ode, ssa, psa]
