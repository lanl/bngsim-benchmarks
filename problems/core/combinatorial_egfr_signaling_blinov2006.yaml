# Combinatorial EGFR signaling. A core problem: member 6 of the ode-net suite (docs/DESIGN.md §3.2).
# The protocol is the model's own ODE simulate action, at the same commit.
# Also member 10 of the psa-net suite: PSA's realistic target, a large network (356 species,
# 3749 reactions) with large populations (1.3e4-1.2e6); its record calls exact SSA impractical.
# PSA: the ODE protocol's first 10 s (EGF binding, receptor dimerization and the first
# phosphorylation), output every 0.5 s: over 30 s an exact trajectory is 8e6 events (bngsim
# 31 s, run_network 32 s on a Darwin node), and bngsim's PSA is no faster at N_c = 1000 (44 s),
# so twelve ensembles over the full 120 s would not fit one job.
id: combinatorial_egfr_signaling_blinov2006
layer: core
title: "Combinatorial EGFR signaling"
source:
  repo: wshlavacek/BNGL-Models
  commit: 9ab070db47faf63853c7376cb715c3ff4f9c67bd
  path: models/combinatorial_egfr_signaling_blinov2006/combinatorial_egfr_signaling_blinov2006.bngl
  sha256: 14f5668d43b031d4ef3e05e6b362c6ad643c617d8a74e4966a815480d3af3f4f
  format: bngl
publications:
  - citation: "Blinov ML, Faeder JR, Goldstein B, Hlavacek WS (2006). A network model of early events in epidermal growth factor receptor signaling that accounts for combinatorial complexity. BioSystems 83:136-151."
    doi: 10.1016/j.biosystems.2005.06.014
verification:
  kind: data
  evidence: models/combinatorial_egfr_signaling_blinov2006/verify_blinov2006.ipynb
  check: "digitized Fig. 2 A/C/D/E network curves, RMS within 2-4 nM per panel asserted"
  result: "RMS 0.44 / 1.51 / 1.33 / 1.72 nM"
capabilities: [ode, psa]
protocol:
  ode:
    netgen: "generate_network({overwrite=>1})"
    t_start: 0
    t_end: 120
    n_steps: 600
    rtol: 1.0e-10
    atol: 1.0e-10
    sparse: true
  psa:
    netgen: "generate_network({overwrite=>1})"
    t_end: 10
    n_steps: 20
    replicates: 100
    timing_replicates: 1
    seed: 1
    poplevels: [10, 30, 100, 300, 1000]
size:
  species: 356
  reactions: 3749
  # Planning only: sized so the planned PSA job matches the probe.
  psa_events: 3500000
suites:
  ode-net: 6
  psa-net: 10
