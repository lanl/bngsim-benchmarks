# KSR1-RAF-MEK inhibitor response. A core problem: member 10 of the ode-net suite (docs/DESIGN.md §3.2).
# The protocol is the model's own ODE simulate action, at the same commit: the drug-free
# relaxation to steady state (time in seconds). Expensive: the file records a 22 min
# BioNetGen ODE solve, set by stiffness rather than size.
# Also member 10 of the ss-net suite: steady-state ppERK against the type II RAF inhibitor RAFi1, the
# Fig. 3B curve at the file's KSR1 = 15 nM and RAS-GTP = 300 nM (PSN1), with the paper's Table S3
# type II factors (fa 0.005, g1a 0.044, g2a 4.346, g3a 1, fKa 0.025; the file's defaults of 1 are a
# drug with no effect). The doses are 20 of the 27 on the ladder of the record's run_imoto2026.py
# (RAFi1_0 in nM = dose/Kd, Kd_BRAF_RAFi1 = 1 nM). Every point starts from the seed species, not
# from the previous dose as run_imoto2026.py does, so each is a full relaxation: the horizon and
# tolerances are the ode protocol's. Expensive (proposal D6b: kept at 20 doses, its own budget).
