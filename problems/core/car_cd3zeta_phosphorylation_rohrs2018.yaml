# CAR CD3zeta site-specific phosphorylation by LCK. A core problem: member 6 of the psa-net suite
# (docs/DESIGN.md §3.2); it entered as a pilot and keeps the pilot's protocol, so its pilot results
# stay current. Six-site phosphorylation of 20,000 CD3zeta by about 20 LCK (the seeded
# 19.703 is rounded to 20 by every stochastic engine) through Michaelis-Menten rate laws with
# competitive inhibition (functional propensities), 64 phosphoforms. LCK is a reactant of every
# reaction, so the smallest participating population is at most 20 and scaling can engage only at
# the smallest N_c. The protocol is ours, not the record's (its active action is the ODE time
# course over 1000 min, with exact SSA commented out beside it): an ensemble from the seed species
# over the first 60 min (time unit: minutes), when A1 is past half-maximal and C1 has begun.
# run_network segfaults or hangs on this network, for exact SSA and PSA alike, on x86 and on the
# native aarch64 build (the pilot's finding): recorded as REFERENCE_FAILED, never worked around.
# Also member 6 of the nf-xml-signaling suite (suites-stochastic.md §2.5): finite (65 / 192), so
# exact SSA on its network is a reference, with functional Michaelis-Menten propensities and the
# non-integer LCK seed (19.703), which shows how each network-free engine converts a count. nf
# protocol: the psa one as a network-free run. run_network's SSA fails on this network here too
# ("edgepop", cost probe 2026-11-24): REFERENCE_FAILED, recorded.
