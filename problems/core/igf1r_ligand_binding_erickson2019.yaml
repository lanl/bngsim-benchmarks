  format: bngl
publications:
  - citation: "Erickson KE, Rukhlenko OS, Shahinuzzaman M, Slavkova KP, Kholodenko BN, Hlavacek WS, et al. (2019). Modeling cell line-specific recruitment of signaling proteins to the insulin-like growth factor 1 receptor. PLoS Comput Biol 15:e1006706."
    doi: 10.1371/journal.pcbi.1006706
  - citation: "Kiselyov VV, Versteyhe S, Gauguin L, De Meyts P (2009). Harmonic oscillator model of the insulin and IGF1 receptors' allosteric binding and activation. Mol Syst Biol 5:243."
    doi: 10.1038/msb.2008.78
verification:
  kind: author_file
  evidence: models/igf1r_ligand_binding_erickson2019/verify_erickson2019.ipynb
  check: "section 3, BNG2.pl only: the authors' SI IGF1R_fit.bngl (vendored as reference/erickson2019_upstream_IGF1R_fit.bngl; the S2 archive pinned by URL and sha256 in reference/erickson2019_upstream.json) at the Table 1 estimates: 7/7 constants equal Table 1; 27 species / 96 reactions and rate laws identical, rate constants to tol 1e-6; the curated block with the authors' actions vs the authors' file, 4 outputs, tolerance 1e-5 of peak; the record's Fig. 5B scan vs the authors', tolerance 1e-4"
  result: "rate constants within 1.3e-7 (Avogadro digits); 4 outputs within 1.2e-7 of peak; scan +6.0e-5 to 6.2e-5 (8852.55 vs the authors' hard-coded 8852 hot-ligand copies)"
capabilities: [sens]
