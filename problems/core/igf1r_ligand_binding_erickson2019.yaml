# IGF1 binding to the preformed IGF1 receptor dimer. A core problem: member 2 of the sens-net
# suite (docs/DESIGN.md §3.2; docs/core_suites.md). The curated record's file, at the Erickson et
# al. (2019) Table 1 fit (not the PyBNF job's file, which ships the Kiselyov et al. 2009 pre-fit
# point). Its rate constants are written per molar and converted to per-molecule rates through
# derived parameters (Avogadro's number, the reference volume per cell), the free ligand's initial
# count is a derived parameter too, and a2prime is fixed by detailed balance, so a correct
# sensitivity follows every chain through a derived parameter, to a rate or to an initial amount.
# The protocol is the record's own binding time course: 7 pM labelled IGF1 for 4 h, no
# competitor. The fitted set has seven members, so the problem is differentiated over every
# independent parameter (11; D3c), the fitted seven kept as a setting; the competitor dose, zero
# here, is differentiated on the labelled dose's 7 pM scale (an absolute FD step).
id: igf1r_ligand_binding_erickson2019
layer: core
title: "IGF1 binding to the IGF1 receptor dimer"
source:
  repo: wshlavacek/BNGL-Models
  commit: 7d6d3660b9146abc49e45d6d21f08b59ad5d34ab
