# Multisite EGFR phosphorylation in CHO EGFR-GFP cells. A core problem: member 4 of the sens-net
# suite (docs/DESIGN.md §3.2; docs/core_suites.md). The curated record's file (its model block is
# the PyBNF job's), at the authors' PyBioNetFit best fit to the SiMPull data. Its seeds and rate
# constants are derived parameters (Avogadro's number, the extracellular and cytoplasmic volumes,
# the subvolume factor f, dose-to-copies conversions), so its sensitivities follow
# derived-parameter initial amounts as well as rates. The protocol is the record's own 25 nM
# EGF time course (Fig. 2D: 0-300 s on its 1 s grid), the file's default dose; the Fig. 2C dose
# scan is not used. The fitted set has six members, so the problem is differentiated over every
# independent parameter (24, including the record's scan multipliers, all at 1; D3c), with the
# fitted six kept as a setting. Species are molecule counts per cell (1e5-1e6).
