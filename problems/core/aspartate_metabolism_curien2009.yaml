# Aspartate metabolism in Arabidopsis from measured kinetic parameters (BioModels
# BIOMD0000000212). A core problem: member 9 of the
# ss-sbml suite (docs/DESIGN.md §3.2; ~/wt/proposals/suites-deterministic.md §2.4). The file
# is the curated BioModels file as sys-bio/temp-biomodels holds it, at the commit ode-sbml pins;
# its curation note (final/BIOMD0000000212/curation_notes.txt there) names a steady-state
# figure. The dose grid follows the curation note; the protocol's horizon and tolerances are
# the suite's (docs/core_suites.md, ss-sbml).
# A metabolic network (8 dynamic species, 23 boundary metabolites and enzymes). The scan is
# V_AA_RS, which three assignment rules pass to the Lys, Thr and Ile tRNA synthetases. At the
# low end the threonine pool takes about 1e7 s to settle, hence t_end = 1e8.
id: aspartate_metabolism_curien2009
layer: core
