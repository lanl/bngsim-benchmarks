    doi: 10.1038/msb.2009.29
verification:
  kind: author_file
  evidence: "BioModels BIOMD0000000212: its curation figure and curation notes (final/BIOMD0000000212/curation_notes.txt at the pinned commit): 'Reproduction of figure 7c of the original publication using Copasi 4.6. Steady states were calculated over a range of values for the maximal velocity of tRNA synthetase, V_max_AA_RS using the parameter scan task of Copasi (250 intervals from 0.15 to 2 uM/s). As steady state fluxes in the protein branches, the fluxes through the Lys, Thr, and Ile tRNA synthetase reactions were taken.'"
  check: "BioModels curation: the curators reproduced Fig. 7c of the paper from this file in COPASI 4.6, steady states over V_max of the tRNA synthetases (V_AA_RS) from 0.15 to 2 uM/s"
  result: "curated; the curation figure reproduces Fig. 7c"
