# The repressilator (BioModels BIOMD0000000012). A core problem: member 3 of the ssa-sbml suite.
# Curated deterministically (SBML ODESolver, Fig. 1c, protein numbers per cell, 0-1000 min);
# the curation notes say the volume was changed so the model can be simulated stochastically,
# and its amounts are molecule numbers. The horizon is the curation figure's, 1000 (the time
# unit is the minute). Nine parameters are set by assignment rules (constants of the model).
# Molecule counts (model preparation, every engine): every compartment has size 1 and an
# amount is a number of molecules; BNGsim and libRoadRunner read it so, and COPASI, which
# imports this file's amounts in #, has its quantity unit set to # (one particle per unit
# amount; the record names the imported unit). Compared: every species a reaction, rule or
# event changes, by SBML id.
# run_network: not applicable (the converter writes the Hill-type transcription laws as flux
# reactions, the same ODE with other jumps); the harness derives the network and records the
# reason in every result. size.ssa_ms_run_network is 0 for planning only.
