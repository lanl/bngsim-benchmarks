# Sequential binding of trivalent TNF to monovalent TNFR1. A core problem: member 3 of the
# nf-xml-aggregation suite (docs/DESIGN.md §3.2, suites-stochastic.md §2.4), the strict finite
# anchor: its network is finite (9 species, 24 reactions) and generated whole, so network-free
# simulation must sample the law of exact SSA on it, and both run_network's SSA and BNGsim's are
# references. The protocol is the record's own network-free benchmark mode at the default dose
# (5 uM TNF, 1 uM TNFR1), which its action block carries commented out beside its SSA and PSA
# modes: one run from free TNF and receptor to 10,000 s in 100 steps, with NFsim's molecule cap
# lifted (gml). About 3,000 TNF trimers and 600 receptors; receptors bind within milliseconds,
# and the slower rearrangement among one-, two- and three-receptor complexes (koff = 0.01 /s) is
# what the grid follows. It was the network-free capability's pilot (layer pilot until
# 2026-11-24), with this protocol (both settings PASS there, timing PASS).
