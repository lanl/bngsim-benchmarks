# Early FceRI signaling. A core problem: member 10 of the ssa-net suite and member 9 of the
# psa-net suite (docs/DESIGN.md §3.2); in ssa-net it takes the place of the paper's Kochanczyk
# 2017 seed (no exact-SSA model; it stays in psa-net), as the large-network member (Q6).
# Thousands of reactions, where the sum tree and the dependency graph matter: 354 species, 3680
# reactions, populations Lyn 28, Rec 400, Syk 400, Lig 6000 (scaled molecule counts). The
# protocol is the file's own condition (its commented SSA action beside the active ODE one:
# 10 nM IgE dimer from the scaled initial state) over its first 2 min rather than 10, output
# every 2 s. A cost decision: COPASI's direct method takes about 22 s a trajectory on this
# network whatever the horizon (24 s at 2 min; the task's initialisation, which each trajectory
# repeats to take its own seed), so 100 of them fill most of the one-hour budget per engine, and
# libRoadRunner's gillespie takes about 25 s per 10-min trajectory. The verified figure is Fig.
# 3 (1.6 nM, 70 min), reproduced by the same model block at Lig_tot = 963.5; the file's own
# condition is that of Figs. 4 and 7.
# PSA: the same protocol, so its exact-SSA ensembles are the SSA job's BNGsim and run_network
# ones. Every reaction has a low-copy participant, so in the probe and the smoke run nothing
# scaled at any N_c: every N_c is gated as exact SSA.
# TODO(pin): the .bngl header calls its active protocol a "Fig. 3-style time course"; a fix is a
# local BNGL-Models branch (verify-early_fceri_signaling_faeder2003-header). Re-pin source.commit
# and source.sha256 to the merged fix; the model block is unchanged, but the results restale.
# Also member 5 of the nf-xml-signaling suite (suites-stochastic.md §2.5), the classic finite
# anchor: network-free simulation against exact SSA on its generated network. nf protocol: the ssa
# one as a network-free run (6,828 particles; ~2.8 s per trajectory in the slowest engine).
