# Prion nucleated polymerization, the Lin et al. (2019) parameterization. A core problem:
# member 8 of the psa-net suite (docs/DESIGN.md §3.2), one of the three published models of the
# PSA paper itself (suites-stochastic.md §2.3, Q5). PrPC 3.8e3-7.6e3 beside three seed trimers and
# low-copy aggregates up to 120 subunits: 3843 reactions. The protocol is the record's own exact-
# SSA action (ten days, the record's choice: take-off happens within days at this PrPC level; Lin
# et al.'s Fig. 7 runs 300 days), output every 0.1 day. Time unit: days. Generation takes about
# 45 s (isomorphism checks on the longest chains). run_network's PSA segfaults on this network at
# t = 0 (probe, 2026-11-24): recorded as REFERENCE_FAILED, never worked around; its exact SSA runs.
# UNVERIFIED: the parameterization matches the bngsim-paper copy but was never checked against
# Lin et al. (2019) itself.
id: prion_nucleated_polymerization_rubenstein2007_benchmark
layer: core
title: "Prion nucleated polymerization (Lin et al. 2019 parameterization)"
source:
  repo: wshlavacek/BNGL-Models
