  path: models/prion_nucleated_polymerization_rubenstein2007/prion_nucleated_polymerization_rubenstein2007_benchmark.bngl
  sha256: 88acf773d57518e377932ea0ac9967166a0bab305eb149639e363caa3ba94c2e
  format: bngl
publications:
  - citation: "Rubenstein R, Gray PC, Cleland TJ, Piltch MS, Hlavacek WS, Roberts RM, Ambrosiano J, Kim J-I (2007). Dynamics of the nucleated polymerization model of prion replication. Biophys Chem 125:360-367."
    doi: 10.1016/j.bpc.2006.09.011
  - citation: "Lin YT, Feng S, Hlavacek WS (2019). Scaling methods for accelerating kinetic Monte Carlo simulations of chemical reaction networks. J Chem Phys 150:244101."
    doi: 10.1063/1.5096774
verification:
  kind: equations
  evidence: models/prion_nucleated_polymerization_rubenstein2007/verify_rubenstein2007.ipynb
  check: "the generated network vs an independent enumeration of the paper's Eqs. 1-6 over chain length, asserted; the fresh BioNetGen run reproduces the committed seeded reference exactly"
  result: "3843/3843 reactions, sets identical; reference reproduced to the last digit"
capabilities: [psa]
protocol:
  psa:
    netgen: "generate_network({overwrite=>1,check_iso=>1,max_iter=>150,max_stoich=>{PrP=>120}})"
    t_end: 10
    n_steps: 100
    replicates: 200
    timing_replicates: 2
    seed: 1
    poplevels: [10, 30, 100, 300, 1000]
size:
