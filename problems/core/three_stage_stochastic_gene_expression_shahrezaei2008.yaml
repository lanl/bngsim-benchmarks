# Three-stage stochastic gene expression. A core problem: member 3 of the ssa-net suite
# (docs/DESIGN.md §3.2); it entered as a pilot and keeps the pilot's protocol, so its pilot
# results stay current.
# Every reaction is of first order, so the network's exact means and variances are a reference of
# their own (moments: linear). Copy numbers are low: the promoter is 0 or 1, mRNA a few, protein
# tens. The protocol is ours, not the record's: an ensemble relaxing from the network's seed species
# (promoter inactive, no mRNA or protein) over ten protein lifetimes (1/d1 = 2000 s), where the
# record samples its stationary distribution from one long trajectory (2.1e8 s).
